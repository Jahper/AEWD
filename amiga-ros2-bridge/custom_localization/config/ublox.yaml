## active set config ##
ublox_gps:
  ros__parameters:

    device: /dev/ttyACM0
    frame_id: ublox_link

    debug: 0

    rate: 1.0
    nav_rate: 1

    dynamic_model: portable
    tmode3: 0

    # Explicitly configure the USB port protocols
    # Without this, config_on_startup wipes RTCM3 input
    uart1:
      in: 33    # UBX (0x01) + RTCM3 (0x20) = 33
      out: 1    # UBX only

    usb:
      in: 33
      out: 1

    publish:
      all: true