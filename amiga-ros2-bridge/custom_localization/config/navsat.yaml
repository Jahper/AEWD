navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: false
    use_odometry_yaw: false
    wait_for_datum: false

    # TODO: with rtk make more pricise 
    # ~3m std dev without RTK
    override_fix_covariance: [9.0, 0.0, 0.0,    
                               0.0, 9.0, 0.0,
                               0.0, 0.0, 9.0]