# =============================================================================
# Nav2 Parameters — Amiga Agricultural Robot  (v2)
# Robot: ~2m wide, ~1m long, differential drive, large wheels with high grip
# =============================================================================
#
# CHANGES IN v2 (this file):
#
# [11] global_costmap width: 40 / height: 40  ← ROOT CAUSE FIX
#      Nav2 was defaulting to 100×100 cells = 5m×5m rolling window.
#      Any goal >2.5m from the robot was "off the global costmap", causing
#      instant plan abort → BT recovery (spin → wait → backup) on every
#      second goal. 40m×40m handles goals up to ~20m away.
#
# [12] obstacle_layer removed from global_costmap
#      Open agricultural field has no permanent obstacles to route around.
#      Global planner now runs on a clean empty map; local costmap (voxel_layer)
#      still handles real-time obstacle avoidance. Saves significant CPU from
#      not recomputing a 800×800 cell obstacle grid at 1Hz.
#
# --------------------------------------------------------------------------
# KNOWN REMAINING LIMITATION:
# Goals directly behind the robot (~180° turn) are imperfect. NavFn generates
# a curved arc path; DWB tries to follow it but the curves are large on a big
# robot. This is a fundamental DWB limitation for differential-drive robots
# with large footprints. If 180° turns need to be reliable, consider switching
# FollowPath to RegulatedPurePursuit which has a built-in in-place rotation
# phase for large angular errors.
# =============================================================================
#
# CHANGES FROM BOTH ORIGINAL FILES (v1 — still in effect):
#
# [1] RotateToGoal critic REMOVED
#     Root cause of "turns 90° before driving" and "spins at goal" in old.txt.
#     Without it, DWB no longer tries to perfectly align heading before moving.
#
# [2] min_speed_theta: 0.20  (was 0.0 in both files)
#     Root cause of motor oscillation in nav2.txt. Large wheels + high grip
#     means tiny theta commands stall and bounce. DWB now only samples angular
#     velocities that are either 0 (straight) or >= 0.20 rad/s (real turn).
#
# [3] acc_lim_theta / rotational_acc_lim raised to 1.2
#     Low values (0.5 in nav2.txt) produced motor commands too weak to overcome
#     static friction. The robot needs a firm initial torque input to actually spin.
#
# [4] yaw_goal_tolerance: 3.14  (was 0.25 in both files)
#     For an agricultural robot driving between waypoints we don't care which
#     direction the robot faces when it arrives. Removing this was causing the
#     endless goal-area spin/backup loop in old.txt.
#
# [5] xy_goal_tolerance: 0.50  (was 0.25 in both files)
#     Appropriate for a 2m-wide outdoor robot. Prevents the jitter/retry loop
#     when GPS noise puts the robot 0.3m "off" goal.
#
# [6] GoalAlign.scale: 4.0  (was 24.0 old / 8.0 new)
#     With yaw_goal_tolerance wide open, a high GoalAlign scale still caused
#     the robot to twist toward the goal direction while approaching. Now low.
#
# [7] PathAlign.forward_point_distance: 0.3  (was 0.1 in both files)
#     Evaluates alignment against a point 0.3m ahead on path instead of 0.1m.
#     Result: smoother, more anticipatory steering — lazy curves for small
#     angular offsets rather than sharp correction twitches.
#
# [8] max_vel_theta: 0.5  (was 1.0 old / 0.3 new)
#     Old was too fast (overshoot), new was too slow (stall). 0.5 rad/s is
#     ~29 deg/s which is firm enough to turn but won't whip past the target.
#
# [9] Robot radius updated to 1.1m (from 0.22 old / 0.80 new)
#     Circumscribed radius of a 2m x 1m body ≈ sqrt(1² + 0.5²) ≈ 1.12m.
#     Previous values were TurtleBot3 defaults — far too small for the Amiga.
#
# [10] velocity_smoother max_accel aligned with controller acc_lim values
#      Previously the smoother had different limits than the controller,
#      causing inconsistent velocity ramp behaviour.
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0   # extra allowance — large robot, needs time to spin up

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50         # [4+5] 50 cm — outdoor ag robot, GPS noise is real
      yaw_goal_tolerance: 3.14159     # [4] don't care about final heading at waypoint

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # --- Velocity limits ---
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.60              # comfortable field speed; raise later if desired
      max_vel_y: 0.0               # differential drive — no lateral motion
      max_vel_theta: 0.50          # [8] ~29 deg/s. Enough to turn, won't whip past target
      min_speed_xy: 0.0
      max_speed_xy: 0.60
      min_speed_theta: 0.20        # [2] CRITICAL — no tiny stall-inducing turn commands
                                   #     turns are either 0 (straight) or ≥0.20 rad/s (real)

      # --- Acceleration limits ---
      # [3] Raised acc_lim_theta: large wheels need firm initial torque to start spinning
      acc_lim_x: 0.80
      acc_lim_y: 0.0
      acc_lim_theta: 1.20
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -1.20

      # --- Sampling ---
      vx_samples: 20
      vy_samples: 1                # differential drive — only vy=0 is ever valid
      vtheta_samples: 30           # more samples → better turn resolution
      sim_time: 1.5                # slightly longer rollout for smoother trajectory scoring

      # --- Tolerances ---
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5    # GPS can lag; be lenient with TF timestamps
      xy_goal_tolerance: 0.50     # must match goal_checker value
      trans_stopped_velocity: 0.20
      short_circuit_trajectory_evaluation: True
      stateful: True

      # --- Critics ---
      # [1] RotateToGoal REMOVED — was root cause of pre-drive spin and goal-area loops
      # [6] GoalAlign scale very low — robot doesn't need to face any particular direction at goal
      # [7] PathAlign forward_point_distance 0.3 — lazy curves, not sharp corrections
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "GoalAlign"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.30   # [7] look further ahead → smoother curves
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      GoalAlign.scale: 4.0                     # [6] low — no heading fixation near goal
      GoalAlign.forward_point_distance: 0.30

# =============================================================================
# Costmaps — robot_radius corrected from 0.22/0.80 to 1.1 for 2m-wide body
# =============================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6                     # larger window to fit the robot's turning radius
      height: 6
      resolution: 0.05
      robot_radius: 1.10           # [9] circumscribed radius of 2m × 1m body
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.40     # safety margin beyond robot_radius
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      # ROOT CAUSE OF SECOND-GOAL FAILURE:
      # Without explicit width/height nav2 defaulted to 100×100 cells = 5m×5m.
      # Any goal >2.5m away was "off the global costmap" → instant planning abort
      # → BT recovery (spin + wait + backup) every single time.
      # 40m×40m handles goals up to ~20m away in any direction.
      width: 40
      height: 40
      use_sim_time: False
      robot_radius: 1.10
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer REMOVED from global costmap intentionally.
      # This is an open agricultural field — there are no permanent global obstacles
      # to plan around. The local costmap (voxel_layer) handles real-time obstacle
      # avoidance. Keeping obstacle_layer here only added noise to global planning
      # and wasted CPU recomputing a 40m×40m obstacle grid at 1Hz.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.40
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "empty_map"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50       # [8] matches max_vel_theta
    min_rotational_vel: 0.25       # [2] meaningful minimum — must actually spin the motors
    rotational_acc_lim: 1.20       # [3] matches acc_lim_theta

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.60, 0.0, 0.50]   # [10] aligned with controller limits
    min_velocity: [-0.60, 0.0, -0.50]
    max_accel: [0.80, 0.0, 1.20]       # [10] aligned with acc_lim values
    max_decel: [-0.80, 0.0, -1.20]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0