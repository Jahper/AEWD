# 100m x 100m completely free map for Amiga GPS navigation
# 2000 x 2000 cells at 0.05m/cell = 100m x 100m
# Centered at (0, 0) — covers ±50m from robot start position
# All cells are free space (white PGM = 255)
image: empty_map.pgm
resolution: 0.05
origin: [-50.0, -50.0, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
